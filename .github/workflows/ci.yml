name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      JWT_SECRET_KEY: test-secret-not-for-production
      JWT_REFRESH_SECRET_KEY: test-refresh-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: Verify the app imports and all routes register
        working-directory: backend
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"
      - name: Create schema and seed
        working-directory: backend
        run: |
          python -c "
          from app.config.database import Base, engine
          import app.models
          Base.metadata.create_all(bind=engine)
          print('schema created')
          "
          python -m seed.seed_data

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package.json }
      - run: npm install
        working-directory: frontend
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
